name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # Required to create GitHub Releases and upload release assets
  id-token: write # Required for Trusted Publishing (OIDC) to npm

jobs:
  release:
    name: Build, Verify, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Use Node 22 LTS
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Project
        run: npm run build

      - name: Verify Package Contents (Dry Run)
        run: npm pack --dry-run

      - name: Pack Release Tarball
        id: pack
        run: |
          PACK_FILE=$(npm pack)
          echo "pack_file=$PACK_FILE" >> $GITHUB_OUTPUT
          echo "Packaged release to $PACK_FILE"

      - name: Publish to npm
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN secret is not set. Attempting Trusted Publishing (OIDC)..."
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN secret is set. Publishing using secret token..."
            npm config set //registry.npmjs.org/:_authToken "${{ secrets.NPM_TOKEN }}"
            npm publish --provenance --access public
          fi

      - name: Upload Packaged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.pack_file }}
          path: ${{ steps.pack.outputs.pack_file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.pack_file }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
